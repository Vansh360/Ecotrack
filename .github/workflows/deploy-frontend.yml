name: Deploy EcoTrack Frontend

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # ==========================================
  # BUILD
  # ==========================================

  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # SETUP NODE
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci


      # ==========================================
      # BUILD FRONTEND
      # ==========================================

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://ecotrack-backend-g66f.onrender.com/api
        run: npm run build


      # ==========================================
      # FIX REACT ROUTER FOR GITHUB PAGES
      # ==========================================

      - name: Create 404 fallback for React routes
        run: cp frontend/dist/index.html frontend/dist/404.html


      # ==========================================
      # SETUP GITHUB PAGES
      # ==========================================

      - name: Setup Pages
        uses: actions/configure-pages@v5


      # ==========================================
      # UPLOAD BUILD
      # ==========================================

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist


  # ==========================================
  # DEPLOY
  # ==========================================

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4